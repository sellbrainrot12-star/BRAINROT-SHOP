<script>
    let cart = [];
    
    // ТВОИ ДАННЫЕ
    const TG_TOKEN = "8449687084:AAEPc1HDjswpTnuQVgtJ-yyccHi3MQcZXGQ"; 
    const TG_CHAT_ID = "8098293089"; // Твой личный ID

    function add(name, price) {
        cart.push({name, price});
        document.getElementById('checkout').style.display = 'block';
        let total = cart.reduce((s, i) => s + i.price, 0);
        document.getElementById('items-list').innerText = "Выбрано: " + cart.map(i => i.name).join(', ');
        document.getElementById('total-sum').innerText = total;
    }

    function sendToTg() {
        const contact = document.getElementById('user-contact').value;
        if(!contact) return alert('Введи свой телеграмм!');

        const items = cart.map(i => i.name).join(', ');
        const total = cart.reduce((s, i) => s + i.price, 0);
        const text = `🛍 НОВЫЙ ЗАКАЗ!\n📦 Товары: ${items}\n💰 Сумма: ${total} руб.\n👤 Клиент: ${contact}`;

        // Самый надежный способ для работы с GitHub Pages
        fetch(`https://api.telegram.org{TG_TOKEN}/sendMessage?chat_id=${TG_CHAT_ID}&text=${encodeURIComponent(text)}`)
        .then(response => {
            if(response.ok) {
                alert('✅ Заказ отправлен! Проверяй личку бота.');
                cart = [];
                document.getElementById('checkout').style.display = 'none';
            } else {
                alert('Ошибка: бот не запущен или ID неверный');
            }
        })
        .catch(() => alert('Браузер блокирует запрос. Залей сайт на GitHub Pages!'));
    }
</script>
