<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brainrot Shop 🧠🔥</title>
    <style>
        :root { --accent: #00ff41; --bg: #050505; --card: #151515; }
        body { font-family: 'Courier New', monospace; background: var(--bg); color: white; margin: 0; padding: 20px; padding-bottom: 120px; }
        h1 { text-align: center; color: var(--accent); text-transform: uppercase; letter-spacing: 3px; text-shadow: 0 0 10px var(--accent); }
        .shop-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1100px; margin: 0 auto; }
        .product-card { background: var(--card); border: 2px solid #333; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; transition: 0.3s; }
        .product-card:hover { border-color: var(--accent); transform: scale(1.03); box-shadow: 0 0 15px var(--accent); }
        .product-img { width: 100%; height: 200px; object-fit: cover; background: #000; border-bottom: 1px solid #333; }
        .info { padding: 15px; flex-grow: 1; }
        .price { color: var(--accent); font-size: 1.4rem; font-weight: bold; margin: 10px 0; }
        .buy-btn { width: 100%; padding: 12px; background: var(--accent); color: black; border: none; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: 0.2s; }
        .buy-btn:hover { background: #fff; }
        .cart-panel { position: fixed; bottom: 0; left: 0; right: 0; background: #111; border-top: 2px solid var(--accent); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; box-shadow: 0 -5px 20px rgba(0,0,0,0.8); }
        #user-contact { background: #000; color: var(--accent); border: 1px solid #444; padding: 10px; border-radius: 5px; width: 200px; outline: none; }
        .checkout-btn { background: #ff00ff; color: white; border: none; padding: 12px 30px; font-weight: bold; cursor: pointer; border-radius: 8px; transition: 0.2s; }
        .checkout-btn:hover { background: #ff55ff; box-shadow: 0 0 10px #ff00ff; }
    </style>
</head>
<body>

    <h1>BRAINROT SHOP</h1>

    <div class="shop-container" id="shop"></div>

    <div class="cart-panel">
        <div style="display: flex; flex-direction: column; gap: 8px;">
            <div>🛒 <span id="cart-count">0</span> шт. | Сумма: <span id="total-price" style="color:var(--accent)">0</span> ₽</div>
            <input type="text" id="user-contact" placeholder="@твой_ник_тг">
        </div>
        <button class="checkout-btn" onclick="sendOrder()">ОФОРМИТЬ ЗАКАЗ</button>
    </div>

    <script>
        // --- ТВОИ ДАННЫЕ ---
        const TG_TOKEN = "8449687084:AAEPc1HDjswpTnuQVgtJ-yyccHi3MQcZXGQ"; // ВСТАВЬ ТОКЕН СЮДА!
        const TG_CHAT_ID = "8098293089"; 

        const products = [
            { id: 1, title: "Skibidi Gold", desc: "Ультра-редкий унитаз из Огайо", price: 999, img: "https://i.ibb.co" },
            { id: 2, title: "Grimace Shake", desc: "Смертельная доза кринжа", price: 450, img: "https://i.ibb.co" },
            { id: 3, title: "Sigma Pack", desc: "Набор для настоящих гигачадов", price: 1500, img: "https://i.ibb.co" }
        ];

        let cart = [];
        const shop = document.getElementById('shop');
        products.forEach(p => {
            shop.innerHTML += `
                <div class="product-card">
                    <img src="${p.img}" class="product-img" onerror="this.src='https://via.placeholder.com'">
                    <div class="info">
                        <h3>${p.title}</h3>
                        <p style="color:#aaa; font-size:0.85rem">${p.desc}</p>
                        <div class="price">${p.price} ₽</div>
                    </div>
                    <button class="buy-btn" onclick="addToCart(${p.id})">В корзину</button>
                </div>`;
        });

        function addToCart(id) {
            cart.push(products.find(p => p.id === id));
            updateUI();
        }

        function updateUI() {
            document.getElementById('cart-count').innerText = cart.length;
            document.getElementById('total-price').innerText = cart.reduce((s, i) => s + i.price, 0);
        }

        async function sendOrder() {
            const contact = document.getElementById('user-contact').value;
            if (cart.length === 0) return alert("Корзина пуста!");
            if (contact.trim().length < 3) return alert("Напиши свой ник ТГ!");

            const total = cart.reduce((s, i) => s + i.price, 0);
            const itemsList = cart.map(p => `• ${p.title} (${p.price}₽)`).join("\n");
            const message = `🚨 *НОВЫЙ ЗАКАЗ!*\n\n👤 *Покупатель:* ${contact}\n\n📦 *Товары:*\n${itemsList}\n\n💰 *ИТОГО:* ${total} руб.`;

            try {
                const res = await fetch(`https://api.telegram.org{TG_TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ chat_id: TG_CHAT_ID, text: message, parse_mode: "Markdown" })
                });
                if (res.ok) {
                    alert("✅ Заказ отправлен!");
                    cart = [];
                    document.getElementById('user-contact').value = "";
                    updateUI();
                } else {
                    alert("❌ Ошибка. Проверь ТОКЕН бота.");
                }
            } catch (e) { alert("Ошибка связи с Telegram."); }
        }
    </script>
</body>
</html>
